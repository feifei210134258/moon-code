appId: com.kimi.agent.desktop
productName: Moon Code
asar: true
npmRebuild: true
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**/*
  - package.json
  # node-pty 只保留随包发布的 prebuilds（N-API）：若混入本机编译的 build/Release/*.node，
  # 其加载顺序优先于 prebuilds，交叉打包时会把错误平台的二进制打进包里。
  # 注意：平台级 files 会整体替换本列表（而非合并），排除规则只能放在全局。
  - '!node_modules/node-pty/build/**'
asarUnpack:
  - node_modules/node-pty/**/*
afterPack: scripts/after-pack.cjs
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
win:
  icon: resources/icon.ico
  target:
    - nsis
  # Windows 本机打包：rcedit 可直接改写 exe 资源（图标 + 版本元数据），
  # 不需要签名证书；只有 macOS 交叉打包才需要 signAndEditExecutable: false。
nsis:
  # 引导式安装向导：欢迎页 → 安装范围（仅我/所有用户）→ 可修改安装目录 → 安装进度 → 完成页。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Moon Code
  # 安装界面语言：NSIS 按系统语言精确/主语言匹配（中文系统出中文向导），
  # 无匹配时回退到列表第一项，故把更通用的 en_US 放在首位。
  installerLanguages:
    - en_US
    - zh_CN
  deleteAppDataOnUninstall: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
